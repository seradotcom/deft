name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm test
      - run: npm run verify:submission
